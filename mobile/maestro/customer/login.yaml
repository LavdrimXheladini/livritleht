# Requires a dev build + `supabase start` (test OTP numbers in supabase/config.toml).
appId: com.movershub.customer
---
- launchApp:
    clearState: true
# Home is public (live prices); signing in starts from the header.
- assertVisible:
    id: quote-pickup
- tapOn:
    id: home-sign-in
- tapOn:
    id: login-target
- inputText: "+38344000001"
- tapOn:
    id: login-send-code
- tapOn:
    id: verify-code
- inputText: "123456"
- tapOn:
    id: verify-submit
- assertVisible:
    id: home-sign-out
