# Requires a dev build + `supabase start` (test OTP numbers in supabase/config.toml).
appId: com.ranktrip.mover
---
- launchApp:
    clearState: true
# Home is public: the Ranktrip Partner intro with the sign-in call to action.
- tapOn:
    id: mover-sign-in
- tapOn:
    id: login-target
- inputText: "+48500000001"
- tapOn:
    id: login-send-code
- tapOn:
    id: verify-code
- inputText: "123456"
- tapOn:
    id: verify-submit
- assertVisible: "Welcome, partner"
